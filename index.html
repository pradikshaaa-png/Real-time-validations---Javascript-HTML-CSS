<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
    }

    #validateform {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background-color: #f5deb3;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      box-sizing: border-box;
    }

    #nameinput, #emailinput, #passinput, #btn {
      padding: 12px;
      width: 100%;
      margin-bottom: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px; 
    }

    .error {
      color: red;
      font-size: 14px;
      margin-bottom: 10px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <form id="validateform">
    <h1>Registration Form</h1>
    <input type="text" placeholder="Name" id="nameinput">
    <span id="nameError" class="error"></span>
    
    <input type="email" placeholder="E-mail" id="emailinput">
    <span id="emailError" class="error"></span>
    
    <input type="password" placeholder="Password" id="passinput">
    <span id="passError" class="error"></span>
    
    <button id="btn" type="submit" disabled>Submit</button>
  </form>

  <script>
    const nameInput = document.getElementById("nameinput");
    const emailInput = document.getElementById("emailinput");
    const passInput = document.getElementById("passinput");
    const nameError = document.getElementById("nameError");
    const emailError = document.getElementById("emailError");
    const passError = document.getElementById("passError");
    const btn = document.getElementById("btn");
    const validateForm = document.getElementById("validateform");

    function Formvalidation() {
      let isValid = true;

      if (nameInput.value.trim() === "") {
        nameError.textContent = "Name cannot be empty.";
        isValid = false;
      } else {
        nameError.textContent = "";
      }

      if (emailInput.checkValidity() && emailInput.value.trim() !== "") {
        emailError.textContent = "";
      } else {
        emailError.textContent = "Email is not valid.";
        isValid = false;
      }

      if (passInput.value.length < 6) {
        passError.textContent = "Password is too short.";
        isValid = false;
      } else {
        passError.textContent = "";
      }

      btn.disabled = !isValid;
    }

    nameInput.addEventListener("input", Formvalidation);
    emailInput.addEventListener("input", Formvalidation);
    passInput.addEventListener("input", Formvalidation);

    validateForm.addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Submitted successfully!");
    });
  </script>

</body>
</html>
